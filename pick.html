<!doctype html>
<html lang="km" data-lang="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>VHM Pick</title>
<!-- VHM Pick 1.0 (4 Nov 2026) — picking list for the packing team. Open it and it shows every item still to pick, grouped by
     shelf (📍 stock location from VHM Inventory), for all orders that are not packed yet.
     READ ONLY: it never writes to the database. Everything comes from VHM Scan (project vhm-menu):
       sv2_orders_idx/<day>   the day's order list (1 read per day shown; a new order upload shows up by itself)
       sv2_orders/<id>        an order's items — read ONCE per device (kept here), and never for orders already packed
       sv2_log                scan sessions: an order scanned complete / shipped short is packed → it leaves the list.
                              Checked once when the page opens (only sessions newer than the last one this device has).
       sv2_meta/shelves       code → shelf, saved by the upload page from VHM Inventory (1 read)
     A ☐ tick is only on this device (to keep track while walking); it is not saved online. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--card2:#f7f8fa;--line:#d9dde5;--tx:#15171c;--mut:#5b6270;--ok:#16a34a;--bad:#dc2626;--warn:#b45309;--acc:#2f6fed;--shelf:#fef3c7;--shelfb:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 'Noto Sans Khmer',system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:var(--tx);font-size:15px}
button{cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:42px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
input,select{background:#f1f3f6;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:42px;max-width:100%}
.mut{color:var(--mut);font-size:13px}
html[data-lang=en] .km,html[data-lang=km] .en{display:none}
html[data-lang=both] .bi>.km{display:block;font-size:.88em;color:var(--mut)}
html[data-lang=both] .bl>.km::before{content:" · "}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.top .r1{display:flex;gap:8px;align-items:center}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#999;flex:none}.dot.on{background:#22c55e}.dot.bad{background:#ef4444}
.top .r2{display:flex;gap:8px;margin-top:8px;align-items:center}
.top .r2 input{flex:1;min-width:0}
.prog{height:8px;background:#e5e7eb;border-radius:99px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);width:0}
main{max-width:760px;margin:0 auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 40px)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips button{flex:none;min-height:36px;border-radius:99px;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.sum b{display:block;font-size:20px}.sum span{font-size:11px;color:var(--mut);line-height:1.2;display:block}
.msg{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;border:1px solid}
.msg.warn{background:#fffbeb;border-color:#fcd34d}.msg.bad{background:#fef2f2;border-color:#fca5a5}.msg.info{background:#eff6ff;border-color:#bfdbfe}
.shelf{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.shelf h2{margin:0;padding:8px 12px;font-size:18px;background:var(--shelf);border-bottom:2px solid var(--shelfb);display:flex;justify-content:space-between;align-items:center;gap:8px}
.shelf h2 small{font-size:13px;font-weight:400;color:#78350f}
.shelf.none h2{background:#f3f4f6;border-bottom-color:#9ca3af}
.shelf.alldone{opacity:.55}
.ln{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid #eef0f4;cursor:pointer;user-select:none}
.ln:first-of-type{border-top:0}
.ln .bx{width:28px;height:28px;border:2px solid #9ca3af;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.ln .tx{flex:1;min-width:0}
.ln .cd{font-weight:700;font-size:17px}
.ln .ds{font-size:15px}
.ln .od{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.ln .q{font-size:22px;font-weight:700;min-width:48px;text-align:right}
.ln.done{background:#f0fdf4}.ln.done .bx{background:var(--ok);border-color:var(--ok)}.ln.done .cd,.ln.done .ds{text-decoration:line-through;color:#6b7280}
.foot{margin-top:16px;text-align:center}
.hide{display:none!important}
@media print{.top,.chips,.noprint,.foot{display:none!important}body{background:#fff}.shelf{break-inside:avoid;border-color:#999}.ln{padding:5px 8px}}
</style>
</head>
<body>
<div class="top">
  <div class="r1">
    <span class="dot" id="dot"></span>
    <h1><span class="bl"><span class="en">🧺 VHM Pick</span><span class="km">បញ្ជីយកទំនិញ</span></span></h1>
    <select id="days" title="Days"><option value="1">Today</option><option value="2">2 days</option><option value="3" selected>3 days</option><option value="7">7 days</option></select>
    <button id="lang" title="Language">EN/ខ្មែរ</button>
  </div>
  <div class="r2">
    <input id="q" type="search" autocomplete="off" placeholder="🔍 Code / shelf · កូដ / ធ្នើ">
    <button id="hide" title="Hide picked"><span class="bl"><span class="en">Hide ✓</span><span class="km">លាក់ ✓</span></span></button>
    <button id="refresh" class="noprint" title="Refresh">🔄</button><button id="print" class="noprint">🖨</button>
  </div>
  <div class="prog"><i id="bar"></i></div>
</div>
<main>
  <div id="state" class="msg info"><span class="bi"><span class="en">Connecting to VHM Scan…</span><span class="km">កំពុងភ្ជាប់ VHM Scan…</span></span></div>
  <div class="chips" id="batches"></div>
  <div id="sum"></div>
  <div id="list"></div>
  <div class="foot mut" id="foot"></div>
  <div class="foot noprint"><button id="clearticks"><span class="bl"><span class="en">Clear my ticks</span><span class="km">លុបសញ្ញាធីក</span></span></button></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* VHM Scan's Firebase project (same values as index.html / upload.html) */
const CONFIG = { apiKey: "AIzaSyCzA--FJTKl74TI0FRhDNGurnOimZjgja0", authDomain: "vhm-menu.firebaseapp.com", projectId: "vhm-menu", storageBucket: "vhm-menu.firebasestorage.app", messagingSenderId: "728781560326", appId: "1:728781560326:web:4f88ffa992cb6175f40187" };
const COL = { orders: 'sv2_orders', idx: 'sv2_orders_idx', log: 'sv2_log', meta: 'sv2_meta' };
const TZ_MS = 7 * 3600e3, KEEP_DAYS = 35, P = 'vhm2pick_';
const $ = id => document.getElementById(id);
const clean = s => (s == null ? '' : String(s)).replace(/[​⁠﻿­]/g, '').replace(/\s+/g, ' ').trim();
const nz = s => clean(s).toUpperCase();
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n || 0).toLocaleString('en-US');
const localNow = () => new Date(Date.now() + TZ_MS).toISOString().replace('Z', '');
const today = () => localNow().slice(0, 10);
const dayShift = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const natCmp = (a, b) => String(a).localeCompare(String(b), 'en', { numeric: true, sensitivity: 'base' });
const bi = (en, km) => `<span class="bi"><span class="en">${en}</span><span class="km">${km}</span></span>`;
const bl = (en, km) => `<span class="bl"><span class="en">${en}</span><span class="km">${km}</span></span>`;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} }
};
const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('vhm2_pick', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const d = await this.open(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const d = await this.open(); return await new Promise(res => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); } catch (e) { return false; } }
};

/* ---------- language ---------- */
const LANGS = ['both', 'en', 'km'];
function setLang(l) { document.documentElement.dataset.lang = l; LS.set('lang', l); }
setLang(LS.get('lang', 'both'));
$('lang').onclick = () => setLang(LANGS[(LANGS.indexOf(document.documentElement.dataset.lang) + 1) % 3]);

/* ---------- state ---------- */
let DAYS = +LS.get('days', 3) || 3; $('days').value = String(DAYS);
let SHELVES = new Map();                       // code -> stock location
const IDX = {};                                // day -> { id: {f, n, st, r} }
let ORD = {};                                  // id -> { r, at, fb, items: [[code, desc, qty, stock]] }   (cached on this device)
let PACKED = { from: '', maxEnd: '', o: {} };  // order id -> end time of the session that packed it (cached on this device)
let TICK = LS.get('tick', {});                 // line key -> true   (this device only)
let BATCH = LS.get('batch', 'all'), HIDE = LS.get('hide', false), Q = '';
let reads = 0, db = null, unsub = [], fetching = new Set(), saveT = 0;

function setShelves(txt) { const m = new Map(); String(txt || '').split('\n').forEach(l => { const [c, st] = l.split('\t'); if (c && st) m.set(nz(c), st); }); SHELVES = m; }
setShelves(LS.get('shelves', ''));
// an order line's shelf: its code, or the model without a size at the end (Vrich "JA29" = JA) — same rule as the phones
function shelfOf(code) { const c = nz(code); if (SHELVES.has(c)) return SHELVES.get(c); const m = c.match(/^(.*\D)\d{2}$/); return (m && SHELVES.get(m[1])) || ''; }
const idxDec = v => { if (v && typeof v === 'object') return v; const p = String(v || '').split('|'); return { f: p[1] || '', n: +p[2] || 0, st: p[3] || 'a', r: +p[4] || 1 }; };
const dayList = () => { const t = today(), a = []; for (let i = 0; i < DAYS; i++) a.push(dayShift(t, -i)); return a; };

function state(cls, en, km) { const el = $('state'); if (!en) { el.className = 'hide'; return; } el.className = 'msg ' + cls; el.innerHTML = bi(en, km || en); }
function saveNow() { clearTimeout(saveT); idb.set('orders', ORD); idb.set('packed', PACKED); }
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }


/* ---------- Firebase ---------- */
async function start() {
  ORD = (await idb.get('orders')) || {};
  const pc = await idb.get('packed');
  // the packed list is read again from scratch once a week (or when more days are shown than it covers)
  if (pc && pc.o && pc.fullAt && Date.now() - pc.fullAt < 7 * 864e5) PACKED = pc;
  // forget what is older than VHM Scan keeps
  const cut = dayShift(today(), -KEEP_DAYS);
  Object.keys(PACKED.o).forEach(id => { if ((PACKED.o[id] || '') < cut) delete PACKED.o[id]; });
  Object.keys(ORD).forEach(id => { if ((ORD[id].d || '') < cut) delete ORD[id]; });
  render();
  if (!window.firebase) { $('dot').className = 'dot bad'; state('bad', 'Cannot load Firebase (no internet?). Showing the last list on this device.', 'មិនអាចភ្ជាប់បាន (គ្មានអ៊ីនធឺណិត?)។ បង្ហាញបញ្ជីចុងក្រោយលើឧបករណ៍នេះ។'); return; }
  const app = (firebase.apps || []).find(a => a.name === 'vhmpick') || firebase.initializeApp(CONFIG, 'vhmpick');
  db = app.firestore();
  try { const au = app.auth(); if (!au.currentUser) { await new Promise(r => { const u = au.onAuthStateChanged(x => { u(); r(x); }); }); if (!au.currentUser) await au.signInAnonymously(); } }
  catch (e) { $('dot').className = 'dot bad'; state('bad', 'Could not sign in to VHM Scan: ' + esc(e.code || e.message), 'មិនអាចចូល VHM Scan៖ ' + esc(e.code || e.message)); return; }
  $('dot').className = 'dot on';
  watchAll();
}
function watchAll() {
  unsub.forEach(f => { try { f(); } catch (e) {} }); unsub = [];
  // 📍 shelves (one document)
  loadShelves();
  // packed orders: read ONCE when the page opens (only scan sessions newer than the newest this device has)
  checkPacked();
  // the order lists of the days shown (1 document per day)
  dayList().forEach(d => unsub.push(db.collection(COL.idx).doc(d).onSnapshot(s => { reads++; const o = (s.exists && s.data().o) || {}, m = {}; Object.keys(o).forEach(id => { m[id] = idxDec(o[id]); }); IDX[d] = m; need(); render(); }, err)));
}
function loadShelves() { db.collection(COL.meta).doc('shelves').get().then(s => { reads++; const d = s.exists ? s.data() : null; if (d) { LS.set('shelves', d.txt || ''); setShelves(d.txt); } render(); }).catch(err); }
async function checkPacked() {
  const from = dayList()[DAYS - 1];
  if (!PACKED.from || PACKED.from > from) PACKED = { from, maxEnd: '', o: {}, fullAt: Date.now() };
  const since = PACKED.maxEnd || PACKED.from;
  try {
    const s = await db.collection(COL.log).where('end', '>', since).get(); reads += Math.max(1, s.size);
    s.docs.forEach(d => { const x = d.data(); if (!x || !x.order) return;
      if ((x.end || '') > PACKED.maxEnd) PACKED.maxEnd = x.end;
      if (x.result === 'complete' || x.result === 'short') PACKED.o[x.order] = x.end || x.start || ''; });
    saveNow(); render();
  } catch (e) { err(e); }
}
function err(e) { $('dot').className = 'dot bad'; const m = esc((e && (e.code || e.message)) || String(e)); state('bad', 'VHM Scan: ' + m + (/permission/i.test(m) ? ' — the Firestore rules do not let this page read it.' : ''), 'VHM Scan៖ ' + m); }

// orders that still have to be packed: in the day list, not cancelled, not packed
function openIds() { const out = []; dayList().forEach(d => { const m = IDX[d] || {}; Object.keys(m).forEach(id => { if (m[id].st !== 'c' && !PACKED.o[id]) out.push([id, d, m[id]]); }); }); return out; }
// read the items of open orders this device does not have yet (or that were changed: new revision)
async function need() {
  if (!db) return;
  const todo = openIds().filter(([id, d, e]) => (!ORD[id] || ORD[id].r !== e.r) && !fetching.has(id));
  if (!todo.length) return;
  todo.forEach(([id]) => fetching.add(id));
  let done = 0; const total = todo.length;
  const show = () => state('info', `Reading ${fmt(done)} / ${fmt(total)} new order(s)…`, `កំពុងអានការកុម្ម៉ង់ថ្មី ${fmt(done)} / ${fmt(total)}…`);
  show();
  const work = todo.slice();
  await Promise.all(Array.from({ length: Math.min(8, work.length) }, async () => {
    while (work.length) {
      const [id, d, e] = work.shift();
      try { const s = await db.collection(COL.orders).doc(id).get(); reads++; const x = s.exists ? s.data() : null;
        if (x && x.items) ORD[id] = { d: x.d || d, r: x.rev || e.r || 1, at: String(x.changedAt || x.at || '').slice(0, 16), fb: clean(x.fb || x.user || e.f || ''), items: x.items.map(i => [clean(i.code), clean(i.desc || [i.size, i.color].filter(Boolean).join(' ')), +i.qty || 1, clean(i.stock || '')]) };
      } catch (er) { console.warn('order', id, er); }
      finally { fetching.delete(id); done++; if (done % 20 === 0) { show(); render(); } }
    }
  }));
  saveSoon(); state(); render();
}

/* ---------- the list ---------- */
function render() {
  const open = openIds().filter(([id]) => ORD[id]);
  // batches = upload rounds (orders uploaded together have the same upload time)
  const B = new Map(); open.forEach(([id]) => { const k = ORD[id].at || '?'; (B.get(k) || B.set(k, []).get(k)).push(id); });
  const keys = [...B.keys()].sort().reverse();
  if (BATCH !== 'all' && !B.has(BATCH)) BATCH = 'all';
  $('batches').innerHTML = `<button data-b="all" class="${BATCH === 'all' ? 'on' : ''}">${bl('All', 'ទាំងអស់')} · ${fmt(open.length)}</button>` +
    keys.map(k => `<button data-b="${esc(k)}" class="${BATCH === k ? 'on' : ''}">⬆ ${esc(k.slice(5, 10).replace('-', '/'))} ${esc(k.slice(11, 16))} · ${fmt(B.get(k).length)}</button>`).join('');
  $('batches').querySelectorAll('button').forEach(b => b.onclick = () => { BATCH = b.dataset.b; LS.set('batch', BATCH); render(); });
  const ids = BATCH === 'all' ? open.map(x => x[0]) : B.get(BATCH);
  // shelf → code → colour/size
  const L = new Map();
  ids.forEach(id => ORD[id].items.forEach(([code, desc, qty, stock]) => {
    const shelf = shelfOf(code), k = nz(code) + '|' + nz(desc);
    const g = L.get(k) || L.set(k, { k, shelf, code, desc, stock, qty: 0, orders: [] }).get(k);
    g.qty += qty; if (!g.orders.includes(id)) g.orders.push(id);
  }));
  // a tick belongs to the line AND to how many pieces it had: when new orders add pieces, the line is open again
  const tk = g => g.k + '|' + g.qty;
  let lines = [...L.values()].sort((a, b) => (!a.shelf - !b.shelf) || natCmp(a.shelf, b.shelf) || natCmp(a.code, b.code) || natCmp(a.desc, b.desc));
  const pcs = lines.reduce((n, g) => n + g.qty, 0), got = lines.filter(g => TICK[tk(g)]).reduce((n, g) => n + g.qty, 0);
  const noShelf = lines.filter(g => !g.shelf).length;
  $('bar').style.width = pcs ? Math.round(got / pcs * 100) + '%' : '0';
  const cell = (n, en, km) => `<div><b>${fmt(n)}</b><span>${bl(en, km)}</span></div>`;
  $('sum').innerHTML = `<div class="sum">${cell(ids.length, 'orders', 'ការកុម្ម៉ង់')}${cell(pcs, 'pieces', 'ដុំ')}${cell(got, 'picked', 'បានយក')}${cell(pcs - got, 'left', 'នៅសល់')}</div>` +
    (noShelf ? `<div class="msg warn">${bi(`${fmt(noShelf)} line(s) have no shelf in VHM Inventory yet — they are at the bottom.`, `${fmt(noShelf)} ជួរមិនទាន់មានធ្នើក្នុង VHM Inventory — នៅខាងក្រោមគេ។`)}</div>` : '') +
    (!SHELVES.size ? `<div class="msg warn">${bi('No shelves from VHM Inventory yet. On the upload page: 🧺 Picking & shelves → 🔄 Update shelves.', 'មិនទាន់មានធ្នើពី VHM Inventory។ នៅទំព័រ upload៖ 🧺 → 🔄 ធ្វើបច្ចុប្បន្នភាពធ្នើ។')}</div>` : '');
  if (Q) { const q = nz(Q); lines = lines.filter(g => nz(g.code).includes(q) || nz(g.shelf).includes(q) || nz(g.desc).includes(q) || g.orders.some(o => o.includes(q))); }
  if (HIDE) lines = lines.filter(g => !TICK[tk(g)]);
  $('hide').classList.toggle('pri', HIDE);
  const S = new Map(); lines.forEach(g => (S.get(g.shelf) || S.set(g.shelf, []).get(g.shelf)).push(g));
  let h = '';
  S.forEach((gs, shelf) => {
    const n = gs.reduce((a, g) => a + g.qty, 0), all = gs.every(g => TICK[tk(g)]);
    h += `<div class="shelf${shelf ? '' : ' none'}${all ? ' alldone' : ''}"><h2><span>📍 ${shelf ? esc(shelf) : bl('No shelf', 'គ្មានធ្នើ')}</span><small>${fmt(n)} ${bl('pcs', 'ដុំ')}</small></h2>` +
      gs.map(g => `<div class="ln${TICK[tk(g)] ? ' done' : ''}" data-k="${esc(tk(g))}"><div class="bx">${TICK[tk(g)] ? '✓' : ''}</div><div class="tx"><div class="cd">${esc(g.code)}</div><div class="ds">${esc(g.desc)}</div><div class="od">${g.orders.length > 1 ? fmt(g.orders.length) + ' orders: ' : '#'}${esc(g.orders.slice(0, 12).join(' · '))}${g.orders.length > 12 ? ' …' : ''}</div></div><div class="q">×${fmt(g.qty)}</div></div>`).join('') + '</div>';
  });
  if (!h) h = ids.length ? `<div class="msg info">${bi('Nothing matches.', 'រកមិនឃើញ។')}</div>` : `<div class="msg info">${bi('🎉 Nothing to pick — every order of the days shown is packed (or none uploaded yet).', '🎉 គ្មានអ្វីត្រូវយក — ការកុម្ម៉ង់ទាំងអស់បានវេចខ្ចប់រួច (ឬមិនទាន់បញ្ចូល)។')}</div>`;
  $('list').innerHTML = h;
  const packedN = Object.keys(PACKED.o).length;
  $('foot').innerHTML = `${bl('New uploads show by themselves · 🔄 to remove packed orders', 'ការបញ្ចូលថ្មីបង្ហាញដោយខ្លួនឯង · 🔄 ដើម្បីដកការកុម្ម៉ង់វេចខ្ចប់រួច')} · 📍 ${fmt(SHELVES.size)} · ${fmt(reads)} reads`;
}
$('list').addEventListener('click', e => {
  const r = e.target.closest('.ln'); if (!r) return;
  const k = r.dataset.k; if (TICK[k]) delete TICK[k]; else TICK[k] = 1;
  LS.set('tick', TICK); render();
});
$('q').addEventListener('input', e => { Q = e.target.value; render(); });
$('hide').onclick = () => { HIDE = !HIDE; LS.set('hide', HIDE); render(); };
$('print').onclick = () => window.print();
$('refresh').onclick = () => { if (db) { loadShelves(); checkPacked(); need(); } };
$('clearticks').onclick = () => { if (confirm('Clear all ✓ ticks on this device? · លុបសញ្ញាធីកទាំងអស់?')) { TICK = {}; LS.set('tick', TICK); render(); } };
$('days').onchange = () => { DAYS = +$('days').value; LS.set('days', DAYS); if (db) watchAll(); render(); };
// ticks of lines that are gone (packed) are dropped once a day so the device does not fill up
(function () { const d = LS.get('tickday', ''); if (d !== today()) { LS.set('tickday', today()); if (d) { TICK = {}; LS.set('tick', TICK); } } })();
start();
</script>
</body>
